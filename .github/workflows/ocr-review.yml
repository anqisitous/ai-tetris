name: Open Code Review

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install OCR
        run: npm install -g @alibaba-group/open-code-review

      - name: Run OCR Review
        run: |
          ocr review --from origin/${{ github.event.pull_request.base.ref }} \
                     --to origin/${{ github.event.pull_request.head.ref }} \
                     --format json > review.json

      - name: Post Review Comments
        run: ocr github-comment --input review.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OCR_LLM_URL: ${{ secrets.OCR_LLM_URL }}
          OCR_LLM_AUTH_TOKEN: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
          OCR_LLM_MODEL: ${{ secrets.OCR_LLM_MODEL }}
          OCR_LLM_USE_ANTHROPIC: ${{ secrets.OCR_LLM_USE_ANTHROPIC }}

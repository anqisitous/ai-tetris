name: Open Code Review (Manual)

on:
  workflow_dispatch:   # 手動トリガー

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install OCR
        run: npm install -g @alibaba-group/open-code-review

      - name: Run OCR Review
        run: |
          ocr review --from main --to feature-branch --format markdown | tee review.md
        env:
          OCR_LLM_URL: ${{ secrets.OCR_LLM_URL }}
          OCR_LLM_AUTH_TOKEN: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
          OCR_LLM_MODEL: ${{ secrets.OCR_LLM_MODEL }}
          OCR_LLM_USE_ANTHROPIC: ${{ secrets.OCR_LLM_USE_ANTHROPIC }}

      - name: Show Review Output in Logs
        run: cat review.md

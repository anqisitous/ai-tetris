name: Open Code Review (Full Repository)

on:
  workflow_dispatch: # 手動トリガー（ボタン1つで実行）

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install Tools
        run: npm install -g @alibaba-group/open-code-review repomix

      - name: Aggregate Entire Repository
        shell: bash
        run: |
          set -e
          echo "=== リポジトリ全体のコードを集約中 ==="
          
          # 不要なディレクトリやビルド生成物・画像等を除外して全コードを1つのテキスト(codebase.txt)にパック
          repomix \
            --out codebase.txt \
            --ignore "node_modules/**,.git/**,dist/**,build/**,coverage/**,package-lock.json,pnpm-lock.yaml,yarn.lock,*.png,*.jpg,*.svg,*.pdf"

      - name: Run Full Code Review
        shell: bash
        run: |
          set -o pipefail
          echo "=== AIによる全体コードレビューを実行中 ==="
          ocr review --file codebase.txt --format markdown | tee review.md
        env:
          OCR_LLM_URL: ${{ secrets.OCR_LLM_URL }}
          OCR_LLM_AUTH_TOKEN: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
          OCR_LLM_MODEL: ${{ secrets.OCR_LLM_MODEL }}
          OCR_LLM_USE_ANTHROPIC: ${{ secrets.OCR_LLM_USE_ANTHROPIC }}

      - name: Show Review Output in Logs
        run: cat review.md

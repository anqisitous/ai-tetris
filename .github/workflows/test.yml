name: AI Tetris CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # テスト（SDLなし）
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential g++ pkg-config
    - name: Configure
      run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTS=ON
    - name: Build tests
      run: cmake --build build --target ai-tetris-tests
    - name: Run tests
      run: |
        cd build
        ctest --output-on-failure --verbose

  # Linux ビルド
  build-linux:
    runs-on: ubuntu-latest
    needs: test
    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential g++ libsdl3-dev libsdl3-ttf-dev
    - name: Configure
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release
    - name: Build
      run: cmake --build build
    - name: Upload binary
      uses: actions/upload-artifact@v4
      with:
        name: ai-tetris-linux
        path: build/ai-tetris

  # macOS ビルド
  build-macos:
    runs-on: macos-latest
    needs: test
    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: brew install cmake
    - name: Configure
      run: |
        mkdir -p build
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release
    - name: Build
      run: |
        cd build
        make -j$(sysctl -n hw.ncpu)
    - name: Upload binary
      uses: actions/upload-artifact@v4
      with:
        name: ai-tetris-macos
        path: build/ai-tetris

  # Windows ビルド（MSYS2 + MinGW）
  build-windows:
    runs-on: windows-latest
    needs: test
    steps:
    - uses: actions/checkout@v4
    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        install: |
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-cmake
          mingw-w64-x86_64-make
          mingw-w64-x86_64-SDL3
          mingw-w64-x86_64-SDL3_ttf
    - name: Configure
      shell: msys2 {0}
      run: |
        mkdir -p build
        cd build
        cmake .. -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release
    - name: Build
      shell: msys2 {0}
      run: |
        cd build
        mingw32-make -j$(nproc)
    - name: Upload binary
      uses: actions/upload-artifact@v4
      with:
        name: ai-tetris-windows
        path: build/ai-tetris.exe

  # コード品質チェック
  code-quality:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install clang-format
      run: sudo apt-get install -y clang-format-14
    - name: Check formatting
      run: |
        find . -name "*.cpp" -o -name "*.h" -o -name "*.hpp" | \
        grep -v build | xargs clang-format-14 --dry-run --Werror

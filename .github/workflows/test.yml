name: AI Tetris CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # 手動実行も可能に

env:
  BUILD_TYPE: Release
  SDL3_VERSION: 3.2.4

jobs:
  # ============================================
  # 1. テストジョブ（SDLなしで実行）
  # ============================================
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential g++ pkg-config

    - name: Configure
      run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTS=ON

    - name: Build tests
      run: cmake --build build --target ai-tetris-tests

    - name: Run tests
      run: |
        cd build
        ctest --output-on-failure --verbose

  # ============================================
  # 2. Linux ビルド（SDL3同梱・静的リンク）
  # ============================================
  build-linux:
    runs-on: ubuntu-latest
    needs: test
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true

    - name: Install SDL3 build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake \
          build-essential \
          g++ \
          pkg-config \
          libx11-dev \
          libxrandr-dev \
          libxinerama-dev \
          libxcursor-dev \
          libxi-dev \
          libgl1-mesa-dev \
          libasound2-dev \
          libpulse-dev \
          libudev-dev \
          libwayland-dev \
          wayland-protocols \
          libdbus-1-dev \
          libegl1-mesa-dev

    - name: Cache SDL3 build
      uses: actions/cache@v3
      id: cache-sdl-linux
      with:
        path: |
          external/SDL3/build
          external/SDL3_ttf/build
        key: linux-sdl3-${{ hashFiles('external/SDL3/**', 'external/SDL3_ttf/**') }}
        restore-keys: |
          linux-sdl3-

    - name: Configure
      run: |
        mkdir -p build
        cd build
        cmake .. \
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
          -DBUILD_SHARED_LIBS=OFF \
          -DSDL_STATIC=ON

    - name: Build
      run: |
        cd build
        make -j$(nproc)

    - name: Upload binary
      uses: actions/upload-artifact@v4
      with:
        name: ai-tetris-linux-x86_64
        path: build/ai-tetris

    - name: Upload symbols (optional)
      uses: actions/upload-artifact@v4
      with:
        name: ai-tetris-linux-symbols
        path: build/ai-tetris.debug

  # ============================================
  # 3. macOS ビルド（SDL3同梱・静的リンク）
  # ============================================
  build-macos:
    runs-on: macos-latest
    needs: test
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true

    - name: Install dependencies
      run: |
        brew install cmake pkg-config

    - name: Cache SDL3 build
      uses: actions/cache@v3
      id: cache-sdl-macos
      with:
        path: |
          external/SDL3/build
          external/SDL3_ttf/build
        key: macos-sdl3-${{ hashFiles('external/SDL3/**', 'external/SDL3_ttf/**') }}
        restore-keys: |
          macos-sdl3-

    - name: Configure
      run: |
        mkdir -p build
        cd build
        cmake .. \
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
          -DBUILD_SHARED_LIBS=OFF \
          -DSDL_STATIC=ON

    - name: Build
      run: |
        cd build
        make -j$(sysctl -n hw.ncpu)

    - name: Upload binary
      uses: actions/upload-artifact@v4
      with:
        name: ai-tetris-macos-arm64
        path: build/ai-tetris

  # ============================================
  # 4. Windows ビルド（MSYS2 + MinGW・SDL3同梱）
  # ============================================
  build-windows-mingw:
    runs-on: windows-latest
    needs: test
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true

    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        install: |
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-cmake
          mingw-w64-x86_64-make
          mingw-w64-x86_64-pkg-config
          mingw-w64-x86_64-ninja
          # SDL3ビルドに必要なツール
          mingw-w64-x86_64-toolchain

    - name: Cache SDL3 build (MSYS2)
      uses: actions/cache@v3
      id: cache-sdl-windows
      with:
        path: |
          external/SDL3/build
          external/SDL3_ttf/build
        key: windows-sdl3-${{ hashFiles('external/SDL3/**', 'external/SDL3_ttf/**') }}
        restore-keys: |
          windows-sdl3-

    - name: Configure (MSYS2)
      shell: msys2 {0}
      run: |
        mkdir -p build
        cd build
        cmake .. \
          -G "MinGW Makefiles" \
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
          -DBUILD_SHARED_LIBS=OFF \
          -DSDL_STATIC=ON

    - name: Build (MSYS2)
      shell: msys2 {0}
      run: |
        cd build
        mingw32-make -j$(nproc)

    - name: Upload binary
      uses: actions/upload-artifact@v4
      with:
        name: ai-tetris-windows-mingw64
        path: build/ai-tetris.exe

  # ============================================
  # 5. Windows ビルド（MSVC + vcpkg）
  # ============================================
  build-windows-msvc:
    runs-on: windows-latest
    needs: test
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true

    - name: Setup vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgDirectory: external/vcpkg
        vcpkgGitCommitId: 'your-commit-id'  # 最新のものを指定

    - name: Install dependencies via vcpkg
      run: |
        cd external/vcpkg
        ./vcpkg install sdl3 sdl3-ttf --triplet x64-windows-static

    - name: Configure
      run: |
        mkdir build
        cd build
        cmake .. \
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
          -DCMAKE_TOOLCHAIN_FILE=../external/vcpkg/scripts/buildsystems/vcpkg.cmake \
          -DVCPKG_TARGET_TRIPLET=x64-windows-static \
          -DBUILD_SHARED_LIBS=OFF

    - name: Build
      run: |
        cd build
        cmake --build . --config ${{ env.BUILD_TYPE }}

    - name: Upload binary
      uses: actions/upload-artifact@v4
      with:
        name: ai-tetris-windows-msvc
        path: build/${{ env.BUILD_TYPE }}/ai-tetris.exe

  # ============================================
  # 6. コード品質チェック
  # ============================================
  code-quality:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install clang-format
      run: sudo apt-get install -y clang-format-14

    - name: Check code formatting
      run: |
        find . -name "*.cpp" -o -name "*.h" -o -name "*.hpp" | \
        grep -v build | grep -v external | \
        xargs clang-format-14 --dry-run --Werror

    - name: Check trailing whitespace
      run: |
        if grep -r "[[:space:]]$" --include="*.cpp" --include="*.h" --include="*.hpp" --exclude-dir=external .; then
          echo "Found trailing whitespace"
          exit 1
        fi

    - name: Check tabs
      run: |
        if grep -r "\t" --include="*.cpp" --include="*.h" --include="*.hpp" --exclude-dir=external .; then
          echo "Found tabs in source files (use spaces)"
          exit 1
        fi
